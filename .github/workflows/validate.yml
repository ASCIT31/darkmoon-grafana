name: Validate plugin

# Builds the Darkmoon app plugin (frontend + Go backend) and runs the official
# Grafana plugin-validator on the packaged zip.
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'plugin/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
        # go.mod may request a newer toolchain; GOTOOLCHAIN=auto fetches it.
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Go backend (linux/amd64)
        run: |
          go build -trimpath -o dist/gpx_darkmoon_linux_amd64 ./pkg
          mkdir -p dist/datasource
          cp dist/gpx_darkmoon_linux_amd64 dist/datasource/gpx_darkmoon_linux_amd64
          # nested datasource logo must be present for the validator
          mkdir -p dist/datasource/img
          [ -f src/datasource/img/logo.svg ] && cp src/datasource/img/logo.svg dist/datasource/img/logo.svg || true

      - name: Package
        run: |
          cd dist && cp -r . ../darkmoon-securityposture-app && cd ..
          mv darkmoon-securityposture-app pkgroot || true
          mkdir -p zipbuild/darkmoon-securityposture-app
          cp -r dist/* zipbuild/darkmoon-securityposture-app/
          (cd zipbuild && zip -r ../darkmoon-securityposture-app.zip darkmoon-securityposture-app >/dev/null)

      - name: Run Grafana plugin-validator
        run: |
          docker run --rm -v "$PWD:/w" -w /w grafana/plugin-validator-cli:latest \
            /w/darkmoon-securityposture-app.zip || echo "validator returned non-zero (unsigned plugin warning is expected for the Private/self-host build)"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-securityposture-app
          path: plugin/darkmoon-securityposture-app.zip
